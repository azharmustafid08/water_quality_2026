<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>UNRAM Marine Monitoring</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #edf3f4; --panel: #fbfdfd; --text: #0c2533; --muted: #4f6874; --line: #d5e2e5;
    --accent: #0b6e7f; --on-accent: #ffffff;
    --hero-a: #0a3b52; --hero-b: #0b6e7f;
    --wave-1: rgba(237,243,244,.35); --wave-2: #edf3f4;
    --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
    --body: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #06161f; --panel: #0c2431; --text: #e4f0f2; --muted: #8fb0b9; --line: #1a3b4a;
      --accent: #5fc6d6; --on-accent: #06232d;
      --hero-a: #08283a; --hero-b: #0a4a5c;
      --wave-1: rgba(6,22,31,.45); --wave-2: #06161f;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 var(--body); }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

  /* ---------- Hero ---------- */
  .hero { position: relative; overflow: hidden; color: #f2fbfc;
          background: linear-gradient(170deg, var(--hero-a), var(--hero-b));
          padding: 36px 20px 96px; }
  .hero-inner { position: relative; z-index: 2; max-width: 1040px; margin: 0 auto; }
  h1 { font: 700 clamp(30px, 5.5vw, 50px)/1.05 var(--display); letter-spacing: -0.02em; margin: 0; }
  .brand { display: flex; align-items: center; gap: clamp(12px, 2.5vw, 20px); }
  .logo { width: clamp(60px, 10vw, 92px); height: auto; flex: none; }
  .hero-sub { margin: 8px 0 0; color: #c4e3e8; max-width: 52ch; }
  .status { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin-top: 22px; }
  .pill { display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px 6px 12px;
          border-radius: 999px; background: rgba(255,255,255,.14); font-weight: 600; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #b7cdd2; }
  .dot.ok { background: #5ee0a8; box-shadow: 0 0 0 4px rgba(94,224,168,.25); }
  .dot.bad { background: #ff9a8a; box-shadow: 0 0 0 4px rgba(255,154,138,.25); }
  .last { color: #d6eef2; }
  .waves { position: absolute; left: 0; right: 0; bottom: -1px; height: 84px; z-index: 1; }
  .waves svg { position: absolute; bottom: 0; left: 0; width: 200%; height: 100%; }
  .waves .w1 { animation: drift 38s linear infinite; }
  .waves .w2 { animation: drift 40s linear infinite reverse; }
  @keyframes drift { to { transform: translateX(-50%); } }
  @media (prefers-reduced-motion: reduce) { .waves svg { animation: none !important; } }

  /* ---------- Layout ---------- */
  .wrap { max-width: 1040px; margin: -26px auto 0; padding: 0 16px 24px; position: relative; z-index: 3; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 16px; }
  .seg { display: inline-flex; padding: 4px; gap: 2px; background: var(--panel);
         border: 1px solid var(--line); border-radius: 999px; }
  button { font: 500 14px var(--body); color: var(--text); cursor: pointer; }
  .seg button { border: 0; background: transparent; padding: 7px 14px; border-radius: 999px; }
  .seg button:hover { background: var(--line); }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
  .spacer { flex: 1; }
  .btn { padding: 8px 16px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); }
  .btn:hover { border-color: var(--accent); }

  .msg { padding: 12px 16px; border-radius: 12px; background: var(--panel);
         border: 1px solid var(--bad-line, #e0907f); margin: 0 0 16px; display: none; }

  /* ---------- Sensor panels ---------- */
  .list { display: grid; gap: 12px; }
  .sensor { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 8px 24px;
            background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 18px 20px; }
  .name { display: flex; align-items: center; gap: 8px; margin: 0; font: 600 15px var(--body); color: var(--muted); }
  .swatch { width: 16px; height: 4px; border-radius: 2px; }
  .val { margin: 6px 0 0; font: 700 46px/1 var(--display); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .unit { font: 500 16px var(--body); color: var(--muted); margin-left: 6px; letter-spacing: 0; }
  .meta { color: var(--muted); font-size: 13px; min-height: 20px; margin-top: 6px; }
  .range { position: relative; height: 6px; border-radius: 3px; background: var(--line); margin: 14px 6px 8px; }
  .range i { position: absolute; top: 50%; width: 14px; height: 14px; border-radius: 50%;
             transform: translate(-50%, -50%); border: 3px solid var(--panel); left: 50%; }
  .stats { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
  .stats b { display: block; color: var(--text); font: 600 14px var(--body); font-variant-numeric: tabular-nums; }
  .stats div:nth-child(2) { text-align: center; } .stats div:last-child { text-align: right; }
  .chart { position: relative; height: 150px; align-self: center; }

  footer { color: var(--muted); font-size: 13px; margin: 18px 4px 0; }

  @media (max-width: 720px) {
    .sensor { grid-template-columns: 1fr; padding: 16px; }
    .hero { padding-bottom: 88px; }
    .spacer { display: none; }
  }
</style>
</head>

      sw: card.querySelector(".swatch"), mark: card.querySelector("[data-mark]"),
      v: card.querySelector("[data-v]"), m: card.querySelector("[data-m]"),
      min: card.querySelector("[data-min]"), avg: card.querySelector("[data-avg]"), max: card.querySelector("[data-max]")
    };
    charts[s.key] = new Chart(card.querySelector("canvas"), {
      type: "line",
      data: { labels: [], datasets: [{ data: [], borderColor: col(s), backgroundColor: col(s) + "22",
              borderWidth: 2, pointRadius: 0, pointHoverRadius: 4, tension: 0.3, fill: true, spanGaps: true }] },
      options: {
        animation: false, maintainAspectRatio: false, responsive: true,
        interaction: { mode: "index", intersect: false },
        plugins: { legend: { display: false } },
        scales: {
          x: { ticks: { maxTicksLimit: 5, maxRotation: 0, font: { size: 11 }, color: css("--muted") }, grid: { display: false } },
          y: { ticks: { font: { size: 11 }, color: css("--muted") }, grid: { color: css("--line") } }
        }
      }
    });
  });

  function applyTheme() {
    SENSORS.forEach(function (s) {
      var c = charts[s.key], d = c.data.datasets[0];
      d.borderColor = col(s); d.backgroundColor = col(s) + "22";
      c.options.scales.x.ticks.color = css("--muted");
      c.options.scales.y.ticks.color = css("--muted");
      c.options.scales.y.grid.color = css("--line");
      els[s.key].sw.style.background = col(s);
      els[s.key].mark.style.background = col(s);
      c.update();
    });
  }
  if (mq.addEventListener) mq.addEventListener("change", applyTheme);

  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function parseTs(s) { return new Date(String(s).replace(" ", "T") + CFG.TZ_OFFSET); }
  function showMsg(t) { var m = document.getElementById("msg"); m.textContent = t; m.style.display = t ? "block" : "none"; }
  function setStatus(cls, text, last) {
    document.getElementById("dot").className = "dot " + cls;
    document.getElementById("statusText").textContent = text;
    document.getElementById("lastInfo").textContent = last || "";
  }

  // "since" dalam waktu lokal Pi (sama dengan format timestamp di Sheet)
  function sinceString(h) {
    var d = new Date(Date.now() - h * 3600e3 + offsetMs());
    return d.getUTCFullYear() + "-" + pad(d.getUTCMonth() + 1) + "-" + pad(d.getUTCDate()) + " " +
           pad(d.getUTCHours()) + ":" + pad(d.getUTCMinutes()) + ":" + pad(d.getUTCSeconds());
  }
  function offsetMs() {
    var m = /([+-])(\d\d):(\d\d)/.exec(CFG.TZ_OFFSET);
    return (m[1] === "-" ? -1 : 1) * (+m[2] * 60 + +m[3]) * 60e3;
  }

  function load() {
    if (!CFG.API_URL) { showMsg("API_URL belum diisi di config.js."); return; }
    setStatus("", "Memuat…", "");
    fetch(CFG.API_URL + "?since=" + encodeURIComponent(sinceString(hours)))
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (!j.ok) throw new Error(j.error || "respon tidak valid");
        data = j; showMsg(""); render();
      })
      .catch(function (e) {
        showMsg("Gagal mengambil data: " + e.message + ". Periksa API_URL di config.js dan pastikan akses deployment Apps Script diatur ke Anyone.");
        setStatus("bad", "Gagal memuat", "");
      });
  }

  function render() {
    var H = data.headers, rows = data.rows;
    var idx = {}; H.forEach(function (h, i) { idx[h] = i; });
    if (!rows.length) {
      setStatus("bad", "Tidak ada data", "Belum ada pembacaan pada rentang waktu ini.");
      SENSORS.forEach(function (s) {
        charts[s.key].data.labels = []; charts[s.key].data.datasets[0].data = []; charts[s.key].update();
        var e = els[s.key]; e.v.textContent = "–"; e.m.textContent = "";
        e.min.textContent = e.avg.textContent = e.max.textContent = "–"; e.mark.style.left = "50%";
      });
      return;
    }

    var step = Math.max(1, Math.ceil(rows.length / MAX_POINTS));
    var sampled = rows.filter(function (_, i) { return i % step === 0 || i === rows.length - 1; });
    var long = hours > 24;
    var labels = sampled.map(function (r) {
      var t = String(r[0]); return long ? t.slice(5, 16) : t.slice(11, 16);
    });

    var lastRow = rows[rows.length - 1];
    SENSORS.forEach(function (s) {
      var vals = sampled.map(function (r) { var v = r[idx[s.key]]; return (v === "" || v === null) ? null : Number(v); });
      var c = charts[s.key], e = els[s.key];
      c.data.labels = labels; c.data.datasets[0].data = vals; c.update();

      var lv = lastRow[idx[s.key]];
      var has = !(lv === "" || lv === null);
      e.v.textContent = has ? Number(lv).toFixed(s.dec) : "N/A";
      e.m.textContent = s.volt ? "Tegangan " + Number(lastRow[idx[s.volt]]).toFixed(3) + " V" : "";

      var all = rows.map(function (r) { var v = r[idx[s.key]]; return (v === "" || v === null) ? NaN : Number(v); })
                    .filter(function (v) { return isFinite(v); });
      if (all.length) {
        var mn = Math.min.apply(null, all), mx = Math.max.apply(null, all);
        var av = all.reduce(function (a, b) { return a + b; }, 0) / all.length;
        e.min.textContent = mn.toFixed(s.dec); e.avg.textContent = av.toFixed(s.dec); e.max.textContent = mx.toFixed(s.dec);
        var pos = (has && mx > mn) ? (Number(lv) - mn) / (mx - mn) * 100 : 50;
        e.mark.style.left = Math.max(0, Math.min(100, pos)) + "%";
      } else {
        e.min.textContent = e.avg.textContent = e.max.textContent = "–"; e.mark.style.left = "50%";
      }
    });

    var ageSec = (Date.now() - parseTs(lastRow[0]).getTime()) / 1000;
    var online = ageSec < CFG.SEND_INTERVAL * 3 + 30;
    var age = ageSec < 3600 ? Math.round(ageSec / 60) + " menit" : (ageSec / 3600).toFixed(1) + " jam";
    setStatus(online ? "ok" : "bad", online ? "Online" : "Offline",
              "Data terakhir " + lastRow[0] + ", " + age + " lalu");
    document.getElementById("footer").textContent =
      rows.length + " titik data dimuat" + (step > 1 ? " (grafik disampel tiap " + step + " titik)" : "") +
      ". Diperbarui otomatis tiap " + CFG.REFRESH_SECONDS + " detik.";
  }

  function downloadCsv() {
    if (!data || !data.rows.length) return;
    var lines = [data.headers.join(",")].concat(data.rows.map(function (r) { return r.join(","); }));
    var a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([lines.join("\n")], { type: "text/csv" }));
    a.download = "marine_" + hours + "jam.csv";
    a.click(); URL.revokeObjectURL(a.href);
  }

  document.querySelectorAll("[data-range]").forEach(function (b) {
    b.addEventListener("click", function () {
      document.querySelectorAll("[data-range]").forEach(function (x) { x.setAttribute("aria-pressed", "false"); });
      b.setAttribute("aria-pressed", "true"); hours = +b.dataset.range; load();
    });
  });
  document.getElementById("btnRefresh").addEventListener("click", load);
  document.getElementById("btnCsv").addEventListener("click", downloadCsv);

  load();
  timer = setInterval(load, CFG.REFRESH_SECONDS * 1000);
})();
</script>
</body>
</html>
